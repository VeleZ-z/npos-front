version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "VeleZ-z"
    labels:
      - "dependencies"
    groups:
      testing:
        patterns:
          - "vitest"
          - "@testing-library/*"
          - "msw"
          - "@vitest/*"
          - "jsdom"
        applies-to: version-updates
      build:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "eslint*"
          - "tailwindcss"
          - "postcss"
          - "autoprefixer"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"